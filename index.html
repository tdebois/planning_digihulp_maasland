<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digipunten Maasland - Overzicht & Zoeken</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .search-section {
      background-color: #f8f9fa;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .location-card {
      transition: transform 0.2s, shadow 0.2s;
    }
    .location-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
    }
    .badge-gemeente {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <!-- Header -->
    <header class="text-center mb-5">
      <h1 class="display-5 fw-bold text-primary">Digipunten Maasland</h1>
      <p class="lead text-muted">Vind een Digipunt bij jou in de buurt voor al je digitale vragen en ondersteuning.</p>
    </header>

    <!-- Zoek- en Filtersectie -->
    <section class="search-section shadow-sm">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="searchInput" class="form-label fw-bold">Zoek op naam of adres</label>
          <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="bv. Bibliotheek, SOMA, Dorpsrestaurant...">
        </div>
        <div class="col-md-3">
          <label for="filterGemeente" class="form-label fw-bold">Gemeente</label>
          <select id="filterGemeente" class="form-select form-select-lg">
            <option value="alle">Alle gemeenten</option>
            <option value="Maasmechelen">Maasmechelen</option>
            <option value="Lanaken">Lanaken</option>
            <option value="Maaseik">Maaseik</option>
            <option value="Dilsen-Stokkem">Dilsen-Stokkem</option>
            <option value="Kinrooi">Kinrooi</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filterDag" class="form-label fw-bold">Dag van de week</label>
          <select id="filterDag" class="form-select form-select-lg">
            <option value="alle">Alle dagen</option>
            <option value="Maandag">Maandag</option>
            <option value="Dinsdag">Dinsdag</option>
            <option value="Woensdag">Woensdag</option>
            <option value="Donderdag">Donderdag</option>
            <option value="Vrijdag">Vrijdag</option>
            <option value="Zaterdag">Zaterdag</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Resultaten Teller -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Beschikbare Digipunten</h4>
      <span id="resultCount" class="badge bg-secondary fs-6">0 punten gevonden</span>
    </div>

    <!-- Kaart / Lijst van resultaten -->
    <div id="resultsContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <!-- Wordt dynamisch gevuld via JS -->
    </div>
  </div>

  <!-- JavaScript Logica & Data -->
  <script>
    // Volledige en bijgewerkte dataset
    const digipunten = [
      // Maasmechelen
      {
        naam: "SOMA Maasmechelen",
        gemeente: "Maasmechelen",
        adres: "Koninginnelaan 102, 3630 Maasmechelen",
        uren: [
          { dag: "Dinsdag", tijd: "10:30 – 12:30" }, // Gecorrigeerde tijd!
          { dag: "Donderdag", tijd: "09:30 – 11:30" }
        ],
        type: "Thomas Actief / Lokaal Punt",
        extraInfo: "Belangrijk centraal punt in Maasmechelen."
      },
      {
        naam: "Bibliotheek Maasmechelen",
        gemeente: "Maasmechelen",
        adres: "Willem Alexanderstraat 1, 3630 Maasmechelen",
        uren: [
          { dag: "Dinsdag", tijd: "15:00 – 17:30" },
          { dag: "Donderdag", tijd: "13:00 – 15:00" }
        ],
        type: "Bibliotheek",
        extraInfo: "Vaste ondersteuning in de bib."
      },
      {
        naam: "De Bolster Maasmechelen",
        gemeente: "Maasmechelen",
        adres: "Kerkstraat 30, 3630 Maasmechelen",
        uren: [
          { dag: "Donderdag", tijd: "13:00 – 15:30" }
        ],
        type: "Lokaal Punt"
      },
      {
        naam: "Gezonde Buurt / CM Maasmechelen",
        gemeente: "Maasmechelen",
        adres: "Rijksweg 310, 3630 Maasmechelen",
        uren: [
          { dag: "Woensdag", tijd: "09:00 – 12:00" }
        ],
        type: "CM Punt"
      },
      {
        naam: "Huisvandemens Maasmechelen",
        gemeente: "Maasmechelen",
        adres: "Rijksweg 342, 3630 Maasmechelen",
        uren: [
          { dag: "Woensdag", tijd: "13:30 – 16:00" }
        ],
        type: "Op Afspraak",
        extraInfo: "Enkel op afspraak bereikbaar."
      },

      // Lanaken
      {
        naam: "Aan de Statie Lanaken",
        gemeente: "Lanaken",
        adres: "Koning Albertlaan 112, 3620 Lanaken",
        uren: [
          { dag: "Donderdag", tijd: "13:30 – 16:00 (1ste + 3de van de maand)" },
          { dag: "Donderdag", tijd: "19:30 – 21:30 (3de van de maand - Repair Café)" }
        ],
        type: "Ontmoetingscentrum"
      },
      {
        naam: "Bibliotheek De Bron Lanaken",
        gemeente: "Lanaken",
        adres: "Aan de Statie 1, 3620 Lanaken",
        uren: [
          { dag: "Woensdag", tijd: "14:00 – 16:00" },
          { dag: "Vrijdag", tijd: "10:00 – 12:00 & 13:00 – 15:00" }
        ],
        type: "Bibliotheek"
      },
      {
        naam: "Babbelbus Lanaken",
        gemeente: "Lanaken",
        adres: "Wisselende wijken in Lanaken",
        uren: [
          { dag: "Donderdag", tijd: "13:30 – 16:30 (2de + 4de van de maand, apr-okt)" }
        ],
        type: "Mobiel Digipunt"
      },
      {
        naam: "Sociaal Huis Lanaken",
        gemeente: "Lanaken",
        adres: "Jan Rosierlaan 1, 3620 Lanaken",
        uren: [
          { dag: "Woensdag", tijd: "09:00 – 11:00" }
        ],
        type: "Sociaal Huis"
      },

      // Maaseik
      {
        naam: "Kringwinkel Maaseik",
        gemeente: "Maaseik",
        adres: "Pelserstraat 19, 3680 Maaseik",
        uren: [
          { dag: "Donderdag", tijd: "15:00 – 17:00" }
        ],
        type: "Kringwinkel"
      },
      {
        naam: "Bibliotheek Maaseik",
        gemeente: "Maaseik",
        adres: "Bleumerstraat 68, 3680 Maaseik",
        uren: [
          { dag: "Woensdag", tijd: "10:00 – 12:00" }
        ],
        type: "Bibliotheek"
      },
      {
        naam: "OCMW Maaseik",

        adres: "Monseigneur Koningsstraat 8, 3680 Maaseik",
        uren: [
          { dag: "Vrijdag", tijd: "10:00 – 12:00" }

      {

        ],
        type: "Dorpsrestaurant"
      },

      // Dilsen-Stokkem
      {
        naam: "LDC Stockheim",

        uren: [
          { dag: "Donderdag", tijd: "09:00 – 12:00 (niet in vakanties)" },

        ],
        type: "Dienstencentrum"
      },
      {
        naam: "Bibliotheek Dilsen-Stokkem",
        gemeente: "Dilsen-Stokkem",
        adres: "Rijksweg 340, 3650 Dilsen-Stokkem",
        uren: [
          { dag: "Maandag", tijd: "14:00 – 16:00" },
          { dag: "Woensdag", tijd: "18:30 – 20:30 (oneven weken)" }
        ],
        type: "Bibliotheek"
      },
      {
        naam: "Kringwinkel Rotem",
        gemeente: "Dilsen-Stokkem",
        adres: "Burgemeester Henrylaan 3, 3650 Dilsen-Stokkem",
        uren: [
          { dag: "Dinsdag", tijd: "15:00 – 17:00" }
        ],
        type: "Kringwinkel"
      },
      {
        naam: "De Zavel Lanklaar",
        gemeente: "Dilsen-Stokkem",
        adres: "Zavelstraat 1, 3650 Lanklaar",
        uren: [
          { dag: "Dinsdag", tijd: "13:00 – 14:30 (1ste + 3de van de maand)" }
        ],
        type: "Lokaal Punt"
      },
      {
        naam: "OC Elen",
        gemeente: "Dilsen-Stokkem",
        adres: "Stationsstraat 10, 3650 Elen",
        uren: [
          { dag: "Maandag", tijd: "14:30 – 16:00 (3de van de maand)" }
        ],
        type: "Ontmoetingscentrum"
      },
      {
        naam: "Casa Fifoli",
        gemeente: "Dilsen-Stokkem",
        adres: "Kerkstraat 12, 3650 Dilsen-Stokkem",
        uren: [
          { dag: "Maandag", tijd: "13:00 – 15:00" }
        ],
        type: "Lokaal Punt"
      },

      // Kinrooi & Neer-/Opoeteren
      {
        naam: "Bibliotheek Kinrooi",
        gemeente: "Kinrooi",
        adres: "Breeërsteenweg 300, 3640 Kinrooi",
        uren: [
          { dag: "Dinsdag", tijd: "15:30 – 18:00" }
        ],
        type: "Bibliotheek"
      },
      {
        naam: "Dorpsrestaurants Kinrooi",
        gemeente: "Kinrooi",
        adres: "Wisselende dorpshuizen Kinrooi",
        uren: [
          { dag: "Donderdag", tijd: "12:30 – 14:00 (wisselende data)" }
        ],
        type: "Dorpsrestaurant"
      },
      {
        naam: "Dorpsrestaurants Neer-/Opoeteren",
        gemeente: "Maaseik",
        adres: "Wisselende locaties Neer-/Opoeteren",
        uren: [
          { dag: "Donderdag", tijd: "12:00 – 14:00 (wisselende data)" }
        ],
        type: "Dorpsrestaurant"
      }
    ];

    // Dom elementen
    const searchInput = document.getElementById('searchInput');
    const filterGemeente = document.getElementById('filterGemeente');
    const filterDag = document.getElementById('filterDag');
    const resultsContainer = document.getElementById('resultsContainer');
    const resultCount = document.getElementById('resultCount');

    // Render functie
    function renderPoints() {
      const searchVal = searchInput.value.toLowerCase().trim();
      const gemeenteVal = filterGemeente.value;
      const dagVal = filterDag.value;

      const filtered = digipunten.filter(p => {
        // Zoekfilter
        const matchSearch = p.naam.toLowerCase().includes(searchVal) || 
                            p.adres.toLowerCase().includes(searchVal) ||
                            p.gemeente.toLowerCase().includes(searchVal);
        
        // Gemeente filter
        const matchGemeente = (gemeenteVal === 'alle') || (p.gemeente === gemeenteVal);

        // Dag filter
        const matchDag = (dagVal === 'alle') || p.uren.some(u => u.dag === dagVal);

        return matchSearch && matchGemeente && matchDag;
      });

      // Update teller
      resultCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'punt' : 'punten'} gevonden`;

      // Maak container leeg
      resultsContainer.innerHTML = '';

      if (filtered.length === 0) {
        resultsContainer.innerHTML = `
          <div class="col-12 text-center py-5">
            <p class="fs-4 text-muted">Geen Digipunten gevonden voor deze criteria.</p>
          </div>
        `;
        return;
      }

      // Render kaarten
      filtered.forEach(p => {
        const urenHtml = p.uren.map(u => `<li><strong>${u.dag}:</strong> ${u.tijd}</li>`).join('');
        const card = document.createElement('div');
        card.className = 'col';
        card.innerHTML = `
          <div class="card h-100 shadow-sm location-card border-0">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge bg-primary badge-gemeente">${p.gemeente}</span>
                <small class="text-muted">${p.type}</small>
              </div>
              <h5 class="card-title fw-bold mb-1">${p.naam}</h5>
              <p class="card-text text-muted small mb-3">📍 ${p.adres}</p>
              
              <h6 class="fw-bold mb-1 fs-6">Openingsuren:</h6>
              <ul class="list-unstyled mb-0 small">
                ${urenHtml}
              </ul>
              ${p.extraInfo ? `<p class="mt-2 mb-0 text-info small">ℹ️ ${p.extraInfo}</p>` : ''}
            </div>
            <div class="card-footer bg-transparent border-0 pt-0 pb-3">
              <a href="https://maps.google.com/?q=${encodeURIComponent(p.naam + " " + p.adres)}" target="_blank" class="btn btn-outline-primary btn-sm w-100">
                Route op kaart 🗺️
              </a>
            </div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    // Event listeners
    searchInput.addEventListener('input', renderPoints);
    filterGemeente.addEventListener('change', renderPoints);
    filterDag.addEventListener('change', renderPoints);

    // Eerste render bij laden
    renderPoints();
  </script>
</body>
</html>
