<!DOCTYPE html>
<html lang="nl" translate="no">
<head>
    <script>
  (function() {
    // 1. Controleer of de gebruiker niet al handmatig een taal heeft gekozen
    const savedLanguage = localStorage.getItem('user_language');
    
    // 2. Haal de voorkeurstaal van de browser op (bijv. "nl-BE", "nl", "en-US", "fr")
    const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();

    // 3. Bepaal de doellocatie op basis van de browser-instelling of opgeslagen taal
    let targetPage = '';

    const lang = savedLanguage || browserLang;

    if (lang.startsWith('nl')) {
      targetPage = 'index.html'; // of 'index-nl.html'
    } else if (lang.startsWith('fr')) {
      targetPage = 'index-fr.html';
    } else if (lang.startsWith('de')) {
      targetPage = 'index-de.html';
    } else if (lang.startsWith('es')) {
      targetPage = 'index-es.html';
    } else if (lang.startsWith('en')) {
      targetPage = 'index-en.html';
    } else {
      targetPage = 'index-en.html'; // Standaard terugvaloptie (fallback) voor overige talen
    }

    // 4. Stuur alleen door als de bezoeker nog niet op de juiste pagina zit
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    
    if (currentPage !== targetPage) {
      window.location.href = targetPage;
    }
  })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Nederlands</title>
    <!-- SEO Taallinks -->
    <link rel="alternate" hreflang="nl" href="index.html" />
    <link rel="alternate" hreflang="fr" href="index-fr.html" />
    <link rel="alternate" hreflang="en" href="index-en.html" />
    <link rel="alternate" hreflang="de" href="index-de.html" />
    <link rel="alternate" hreflang="es" href="index-es.html" />
</head>
<body>

    <header>
        <!-- Taalschakelaar -->
        <nav class="language-switcher">
            <span><strong>NL</strong></span> | 
            <a href="index-fr.html">FR</a> | 
            <a href="index-en.html">EN</a> | 
            <a href="index-de.html">DE</a> | 
            <a href="index-es.html">ES</a>
        </nav>
        
        <!-- Hoofdnavigatie -->
<nav class="language-switcher">
  <a href="index.html" onclick="setLanguage('nl')">NL</a> | 
  <a href="index-fr.html" onclick="setLanguage('fr')">FR</a> | 
  <a href="index-en.html" onclick="setLanguage('en')">EN</a> | 
  <a href="index-de.html" onclick="setLanguage('de')">DE</a> | 
  <a href="index-es.html" onclick="setLanguage('es')">ES</a>
</nav>
    </header>

    <main>
        <h1>Welkom op de Nederlandse Index</h1>
        <p>Dit is de hoofdindexpagina in het Nederlands.</p>
        <p>Ga naar de <a href="pagina-nl.html">Nederlandse informatiepagina</a>.</p>
    </main>

<!-- Overige inhoud van je pagina... -->

    <!-- PLAATS DE FUNCTIE ONDERAAN DE BODY -->
    <script>
      function setLanguage(langCode) {
        localStorage.setItem('user_language', langCode);
      }
    </script>
</body>
</html>
